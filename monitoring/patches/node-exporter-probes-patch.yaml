spec:
  template:
    spec:
      containers:
      - name: node-exporter
        livenessProbe:
          httpGet:
            path: /
            port: 9100
          initialDelaySeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 9100
          initialDelaySeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
